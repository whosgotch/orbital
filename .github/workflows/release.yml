name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            triple: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.triple }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Build worker sidecar
        run: node scripts/build-worker.mjs ${{ matrix.triple }}
        working-directory: app

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Orbital ${{ github.ref_name }}
          releaseDraft: false
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}

      # The curl installer wants a plain tarball of the .app: extracting a
      # tar.gz to /Applications is scriptable, mounting a .dmg is not.
      - name: Upload macOS .app tarball
        if: startsWith(matrix.os, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="app/src-tauri/target/${{ matrix.triple }}/release/bundle/macos"
          ARCH=$(echo "${{ matrix.triple }}" | cut -d- -f1)
          tar -czf "Orbital_${ARCH}.app.tar.gz" -C "$APP_DIR" Orbital.app
          gh release upload "${{ github.ref_name }}" "Orbital_${ARCH}.app.tar.gz" --clobber
