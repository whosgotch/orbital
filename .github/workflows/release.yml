name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            triple: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      # Full history: the changelog step walks back to the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every runner computes the same body; whichever job wins the race to
      # create the release supplies it.
      - name: Build changelog
        id: changelog
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          {
            echo "body<<CHANGELOG_EOF"
            if [ -n "$previous" ]; then
              echo "## What's Changed"
              echo
              git log --no-merges --pretty='- %s' "$previous"..HEAD
              echo
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$previous...${{ github.ref_name }}"
            else
              # Without a previous tag the range is the entire history, which is
              # not a changelog.
              echo "Initial release."
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.triple }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Build worker sidecar
        run: node scripts/build-worker.mjs ${{ matrix.triple }}
        working-directory: app

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Orbital ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          # A semver prerelease tag (v0.1.0-alpha.1) marks the release as such,
          # which keeps /releases/latest - and so install.sh - on stable builds.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}

      # The curl installer wants a plain tarball of the .app: extracting a
      # tar.gz to /Applications is scriptable, mounting a .dmg is not.
      - name: Upload macOS .app tarball
        if: startsWith(matrix.os, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_DIR="app/src-tauri/target/${{ matrix.triple }}/release/bundle/macos"
          ARCH=$(echo "${{ matrix.triple }}" | cut -d- -f1)
          tar -czf "Orbital_${ARCH}.app.tar.gz" -C "$APP_DIR" Orbital.app
          gh release upload "${{ github.ref_name }}" "Orbital_${ARCH}.app.tar.gz" --clobber
